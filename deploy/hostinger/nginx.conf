# Kvastram — Nginx reverse proxy config
# Deploy: copy to /etc/nginx/sites-available/kvastram
#         then: ln -s /etc/nginx/sites-available/kvastram /etc/nginx/sites-enabled/kvastram
#         then: nginx -t && systemctl reload nginx
#
# SSL certificates are managed by Certbot / Let's Encrypt.
# Run once: certbot --nginx -d kvastram.com -d www.kvastram.com -d admin.kvastram.com -d api.kvastram.com

# ── Redirect all HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    server_name kvastram.com www.kvastram.com admin.kvastram.com api.kvastram.com mcp.kvastram.com;
    return 301 https://$host$request_uri;
}

# ── Storefront ─ kvastram.com / www.kvastram.com ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name kvastram.com www.kvastram.com;

    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── Admin Panel ─ admin.kvastram.com ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.kvastram.com;

    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Allow larger bodies for file uploads in admin panel
    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── API ─ api.kvastram.com ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.kvastram.com;

    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Allow larger bodies for file uploads
    client_max_body_size 100M;

    # Standard REST API traffic
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket — Socket.io real-time inventory updates (long-lived connections)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long timeout needed for persistent WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ── MCP Server ─ mcp.kvastram.com ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mcp.kvastram.com;

    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # MCP uses SSE streams — disable buffering
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
