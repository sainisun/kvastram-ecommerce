# ============================================================
# Kvastram — Nginx config for Hostinger VPS
# Domains: vintaaj.com | admin.vintaaj.com | api.vintaaj.com
#
# SSL certs are managed by Certbot (Let's Encrypt).
# Run once to get certs:
#   certbot --nginx -d vintaaj.com -d www.vintaaj.com \
#           -d admin.vintaaj.com -d api.vintaaj.com
# Certbot will edit this file automatically with SSL blocks.
# ============================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name vintaaj.com www.vintaaj.com admin.vintaaj.com api.vintaaj.com;
    return 301 https://$host$request_uri;
}

# ── Storefront (vintaaj.com) ────────────────────────────────
server {
    listen 443 ssl;
    server_name vintaaj.com www.vintaaj.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/vintaaj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vintaaj.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Admin Panel (admin.vintaaj.com) ─────────────────────────
server {
    listen 443 ssl;
    server_name admin.vintaaj.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/vintaaj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vintaaj.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Backend API (api.vintaaj.com) ───────────────────────────
server {
    listen 443 ssl;
    server_name api.vintaaj.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/vintaaj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vintaaj.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
