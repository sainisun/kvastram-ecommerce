# ============================================================
# Kvastram — Nginx config for Hostinger VPS
# Domains: kvastram.com | admin.kvastram.com | api.kvastram.com
#
# SSL certs are managed by Certbot (Let's Encrypt).
# Run once to get certs:
#   certbot --nginx -d kvastram.com -d www.kvastram.com \
#           -d admin.kvastram.com -d api.kvastram.com
# Certbot will edit this file automatically with SSL blocks.
# ============================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name kvastram.com www.kvastram.com admin.kvastram.com api.kvastram.com;
    return 301 https://$host$request_uri;
}

# ── Storefront (kvastram.com) ────────────────────────────────
server {
    listen 443 ssl;
    server_name kvastram.com www.kvastram.com;

    client_max_body_size 25m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Admin Panel (admin.kvastram.com) ─────────────────────────
server {
    listen 443 ssl;
    server_name admin.kvastram.com;

    client_max_body_size 25m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Backend API (api.kvastram.com) ───────────────────────────
server {
    listen 443 ssl;
    server_name api.kvastram.com;

    client_max_body_size 25m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/kvastram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvastram.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
