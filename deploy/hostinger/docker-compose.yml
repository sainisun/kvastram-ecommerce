name: kvastram

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file:
      - ../../.env.hostinger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  storefront:
    build:
      context: ../../storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../storefront/.env.production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  admin:
    build:
      context: ../../admin
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../admin/.env.production
    environment:
      # BACKEND_URL must point to the backend Docker service so Next.js rewrites work inside the container.
      # This overrides any value (or absence) in admin/.env.production.
      - BACKEND_URL=http://backend:4000
      - NODE_ENV=production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
  backend_uploads:
