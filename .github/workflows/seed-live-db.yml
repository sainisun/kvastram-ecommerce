name: Seed Live Database

on:
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  seed:
    name: Run Database Seed Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Seed Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.24.193.227
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 10m
          script: |
            set -e
            echo "=== Seeding Live Database ==="
            cd /root/kvastram-ecommerce/backend
            
            echo "Running seed-real-data.ts using a temporary docker container..."
            docker run --rm \
              --network kvastram_default \
              --env-file .env.production \
              -v "$(pwd)":/app \
              -w /app \
              node:20-bookworm-slim \
              bash -c "npm ci && npx tsx scripts/seed-real-data.ts"
            
            echo "✅ Seed Complete!"
