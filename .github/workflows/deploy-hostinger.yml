name: Deploy to Hostinger VPS
# Trigger: push to main branch only
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

concurrency:
  group: kvastram-production
  cancel-in-progress: false

jobs:
  quality:
    name: Production quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Verify repository ancestry
        run: |
          git fetch origin main
          node scripts/check-repository-state.mjs
      - name: Require a merged pull request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          merged_count="$(printf '%s' "$response" | jq \
            '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "$merged_count" -lt 1 ]; then
            echo "Production deployment requires a pull request merged into main."
            exit 1
          fi
      - name: Install storefront dependencies
        working-directory: storefront
        run: npm ci --legacy-peer-deps
      - name: Verify storefront
        working-directory: storefront
        env:
          INTERNAL_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: |
          npm run verify:design-system
          npm run audit:design-system:metrics
          npm run build
      - name: Install Playwright Chromium
        working-directory: storefront
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke tests
        working-directory: storefront
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-playwright-failures
          path: |
            storefront/test-results
            storefront/playwright-report
          if-no-files-found: ignore

  deploy:
    name: SSH Deploy
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.24.193.227
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 25m
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /root/kvastram-ecommerce
            # Hard reset to match GitHub exactly (prevents divergence errors)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            if [ ! -f deploy/hostinger/.env ]; then
              echo "=== Creating compose env defaults ==="
              mkdir -p deploy/hostinger
              printf 'NEXT_PUBLIC_API_URL=https://api.kvastram.com\n' > deploy/hostinger/.env
            fi
            KVASTRAM_PRODUCTION_DEPLOY=1 bash deploy/hostinger/deploy.sh
