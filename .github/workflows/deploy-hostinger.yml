name: Deploy to Hostinger VPS
# Trigger: push to main branch only
on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI
jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 25m
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd ${{ secrets.VPS_PROJECT_PATH }}
            # Hard reset to match GitHub exactly (prevents divergence errors)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            if [ ! -f deploy/hostinger/.env ]; then
              echo "=== Creating compose env defaults ==="
              mkdir -p deploy/hostinger
              printf 'NEXT_PUBLIC_API_URL=https://api.kvastram.com\n' > deploy/hostinger/.env
            fi
            bash deploy/hostinger/deploy.sh
