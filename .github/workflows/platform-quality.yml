name: Platform Quality

on:
  push:
  pull_request:

concurrency:
  group: platform-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-test-jwt-secret-not-used-outside-github-actions
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_production_secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run test:migrations:safety
      - run: npm run build
      - name: Apply schema for read-path benchmark
        run: npx tsx src/db/migrate.ts && npx tsx src/db/run-manual-migrations.ts
      - name: Start benchmark backend
        run: |
          PORT=4100 NODE_ENV=test node dist/index.js > /tmp/kvastram-benchmark-backend.log 2>&1 &
          echo $! > /tmp/kvastram-benchmark-backend.pid
          npx wait-on http://127.0.0.1:4100/health --timeout 60000
      - name: Run live API integration regression suite
        run: API_URL=http://127.0.0.1:4100 npm run test:integration
      - name: Enforce bounded read-path performance budget
        run: API_URL=http://127.0.0.1:4100 BENCHMARK_REQUESTS=100 BENCHMARK_CONCURRENCY=10 BENCHMARK_MAX_P95_MS=1000 npm run benchmark:api

  admin:
    name: Admin quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  wholesale:
    name: Wholesale quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wholesale
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: wholesale/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
