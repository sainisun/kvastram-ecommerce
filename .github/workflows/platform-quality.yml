name: Platform Quality

on:
  push:
  pull_request:

concurrency:
  group: platform-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-test-jwt-secret-not-used-outside-github-actions
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run test:migrations:safety
      - run: npm run build

  admin:
    name: Admin quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  wholesale:
    name: Wholesale quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wholesale
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture boundaries
        working-directory: .
        run: node scripts/check-architecture-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: wholesale/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
