name: Storefront Quality

on:
  push:
  pull_request:
concurrency:
  group: storefront-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Verify repository ancestry
        run: |
          git fetch origin main
          node scripts/check-repository-state.mjs
      - name: Install storefront dependencies
        working-directory: storefront
        run: npm ci --legacy-peer-deps
      - name: Verify package signatures
        working-directory: storefront
        run: npm audit signatures
      - name: Audit runtime dependencies
        working-directory: storefront
        run: npm audit --omit=dev --audit-level=high
      - name: Verify design system and unit tests
        working-directory: storefront
        run: npm run verify:design-system
      - name: Report design-system metrics
        working-directory: storefront
        run: npm run audit:design-system:metrics
      - name: Build storefront
        working-directory: storefront
        env:
          INTERNAL_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: storefront
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke tests
        working-directory: storefront
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-playwright-failures
          path: |
            storefront/test-results
            storefront/playwright-report
          if-no-files-found: ignore
